# dsh-ocgo-usage bundle patch: inserts its plugin row into the web profile
# roster. The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile web add <path-or-git-url>`.
#
# The single row mounts BOTH halves: the host side (OpenCode Go usage fetch +
# /api/ocgo-usage JSON endpoints) and the browser side (the composer-dock
# usage readout, via the dsh.client declaration in package.json).
- insert:
    - id: ocgo-usage
      name: 'dsh-ocgo-usage'
